<div class="div-logo">
  <img class="login-logo" src="/assets/img/logoPaouvir.png" alt="Logo Paouvir" />
</div>
<div class="box-login">
  <div class="form-login">
    <div class="div-inputs">

      <app-input
        label="Usuário"
        placeholder="Digite seu nome de usuário"
      ></app-input>

      <app-input
        label="Senha"
        placeholder="Digite sua senha"
        type="password" suffixIcon="fa fa-eye"
      ></app-input>

      <app-input
        label="Confirmação de Senha"
        placeholder="Digite sua senha novamente"
        type="password" suffixIcon="fa fa-eye"
      ></app-input>

    </div>
    <div class="div-botao">
      <app-button variant="primary" size="md">
        Concluir Cadastro
      </app-button>

      <app-button variant="secondary" size="md">
        Voltar
      </app-button>
    </div>
  </div>
</div>
