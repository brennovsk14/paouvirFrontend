<div class="bandas">
  <div class="headerBandas">
    <span>Bandas</span>
    <app-button
      prefixIcon="fa fa-plus"
      variant="primary"
      label="Cadastar Banda"
    ></app-button>
  </div>

  <div class="cardBandas">
    <app-card
      *ngFor="let banda of bandas"
      [hoverable] = "true"
      [title]="banda.nome"
    ></app-card>
  </div>
</div>
