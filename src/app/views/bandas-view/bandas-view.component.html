<div class="bandas">
  <div class="headerBandas">
    <span>Bandas</span>
    <app-button
      prefixIcon="fa fa-plus"
      variant="primary"
      label="Cadastar Banda"
    ></app-button>
  </div>

  <app-carrossel [listaItens]="bandas" [itemTemplate]="cardBandaTemplate"></app-carrossel>
  <ng-template #cardBandaTemplate let-banda>
    <app-card
      [hoverable]="true"
      [title]="banda.nome"
    ></app-card>
  </ng-template>
</div>
