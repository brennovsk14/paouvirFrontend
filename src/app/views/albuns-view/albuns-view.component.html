<div class="albuns">
  <div class="headerAlbuns">
    <span>Albuns</span>
    <app-button
      prefixIcon="fa fa-plus"
      variant="primary"
      label="Cadastar Album"
    ></app-button>
  </div>

  <div class="cardAlbuns">
    <app-card
      *ngFor="let album of albuns"
      [hoverable] = "true"
      [title]="album.nome"
    ></app-card>
  </div>
</div>
